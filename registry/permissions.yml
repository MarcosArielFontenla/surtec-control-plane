permissions:
  allowed_sandbox_modes:
    - read-only
    - workspace-write

  prohibited_sandbox_modes:
    - danger-full-access

  editing_agents:
    - tech-lead
    - backend-engineer
    - frontend-engineer
    - devops-engineer
    - documentation-writer

  read_only_agents:
    - product-manager
    - qa-reviewer
    - security-reviewer
    - reality-checker
    - legal-reviewer-ar

  secrets_policy:
    may_read_real_secrets: false
    may_write_real_secrets: false
    allowed_secret_files:
      - .env.example
    prohibited_patterns:
      - .env
      - "*.pem"
      - "*.key"
      - "*token*"

  deployment_policy:
    automatic_deploy: false
    requires_human_approval: true
    allowed_without_approval:
      - dry-run
      - validation
      - local-preview

  merge_policy:
    automatic_merge: false
    requires_human_approval: true
    protected_branches:
      - main
      - master

  branch_policy:
    task_branch_pattern: agent/<task-id>-<agent-id>
    worktree_root: ../surtec-worktrees
    require_clean_worktree_before_branch: true
    push_by_default: false

