projects:
  legal-ai-workbench:
    repo: git@github.com:surtec/legal-ai-workbench.git
    local_path: ~/dev/surtec/legal-ai-workbench
    default_branch: main
    status: planned
    allowed_agents:
      - product-manager
      - tech-lead
      - backend-engineer
      - frontend-engineer
      - qa-reviewer
      - security-reviewer
      - legal-reviewer-ar
      - reality-checker
    sandbox:
      default: workspace-write
      legal_review: read-only
    commands:
      install: pnpm install
      test: pnpm test
      build: pnpm build
      lint: pnpm lint
    approval:
      before_merge: true
      before_deploy: true

