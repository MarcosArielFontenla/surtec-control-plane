# Surtec Control Plane — project registry (config overlay)
#
# Discovery drives the project LIST (real git repos under SURTEC_PROJECTS_ROOT,
# default E:\product-projects). This file OVERLAYS config by folder name: repo,
# default_branch, allowed_agents, sandbox, commands. A discovered project with no
# entry here is shown but "sin configurar" (not dispatchable).
#
# `deploy_url` (optional): the project's public deployed URL (e.g. its Railway URL). When set, the
#   dashboard shows a read-only health-check (up/degraded/down) on the card. Leave unset to hide it.
#   Example:  deploy_url: https://my-app.up.railway.app
#
# Generated 2026-05-29 from discovery + git remotes + package.json, with policy:
#   sandbox.default = read-only (agents analyze only; opt a project into
#   workspace-write to let them edit), allowed_agents = standard engineering subset.
# `status` defaults to "active" — adjust per project as you like.
# NOTE: Angular `test` (ng test / Karma) needs headless flags for self-verify;
# since the default is read-only, verify does not run until you opt into workspace-write.

projects:
  appointment-manager:
    repo: https://github.com/MarcosArielFontenla/appointment-manager.git
    local_path: E:/product-projects/appointment-manager
    default_branch: master
    status: active
    allowed_agents:
      - product-manager
      - tech-lead
      - backend-engineer
      - frontend-engineer
      - qa-reviewer
      - security-reviewer
      - reality-checker
      - documentation-writer
    sandbox:
      default: read-only
    commands:
      install: cd frontend && npm install
      dev: cd frontend && npm run start
      build: cd frontend && npm run build
      test: cd frontend && npm test
    approval:
      before_merge: true
      before_deploy: true

