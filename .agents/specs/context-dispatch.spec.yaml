schema_version: 1
name: Phase N - bounded context and logical roles
entity: ContextDispatch
domains: [context-assembly, execution-policy, task-evidence, dashboard]
purpose: Assemble attributable bounded task context and enforce logical role restrictions through the existing runtime and policy boundaries.
requirements:
  - id: req-roles
    description: Versioned role profiles define responsibility, task kinds, sandbox ceiling, required skills/evaluations, capabilities, approvals, budget policy and handoff references. Provide six safe defaults over existing registered agents; role selection never grants project or agent permissions.
  - id: req-context
    description: Assemble ten roadmap layers in stable precedence, deduplicate sources and attribute fingerprints, selection reasons, exact byte/line sizes and sensitivity. Project instructions are untrusted context, not privileged policy. Select files through contained explicit metadata and supported Harness routes, never recursive Markdown concatenation.
  - id: req-budget
    description: Enforce configurable rendered-context limits with defaults of 500 physical lines and 60000 UTF-8 bytes, code ceilings of 2000 lines and 128000 bytes, at most 64 sources and 256 KiB per inspected file. Required invalid or oversized context blocks dispatch without truncating mandatory instructions. Preserve existing instruction length, runtime, token, attempt and concurrency ceilings; role defaults only tighten them.
  - id: req-privacy
    description: Exclude all client categories by default and resolve selected consent categories server-side through the existing client-context service. Preview and manifest never expose confidential bodies, credentials or absolute source paths. Redact known secret/path forms before transmission; no claim of universal secret detection or instruction-injection immunity is made.
  - id: req-routing
    description: Deterministically explain direct execution, planning, review depth, QA or human decision using authorized issue scale/scope/domains, criticality/security/migration, trusted policies, role capabilities and budget/concurrency evidence. Delegation admission requires independent objectively verifiable benefit and isolated authority; it is an inspectable decision only, not permission to spawn workers in this phase.
  - id: req-testing
    description: Resolve the most restrictive applicable global/archetype/project/issue/role testing and review constraints from trusted versioned configuration. Functional is default and only exact currently authorized runners may execute. Strict TDD requires trusted runner configuration and independently captured ordered RED/GREEN plus REFACTOR or justified no-refactor evidence bound to scope/candidate; missing evidence cannot become verified completion. No policy-waiver editor or implicit downgrade is introduced.
  - id: req-preview
    description: Before generic analysis or issue dispatch show safe role/context/routing/testing/review/budget/approval and excluded-category evidence. A fingerprint binds preview to request, issue revision, consent and current sources/policy; server reassembly rejects stale or forged previews before task creation. Preview alone never queues work, saves Harness observations or executes a runner.
  - id: req-evidence
    description: Every new admitted task records a strict version-1 context manifest and role/routing/policy evidence as an additive validated envelope field under existing task locks/atomic writes. Persist hashes and bounded classifications, not copies of source documents. Revalidate before each attempt; changes to admitted required context or safety policy stop safely. Bound and redact prior summaries; do not reuse a thread across changed consent or a broadened execution contract.
  - id: req-compatibility
    description: Preserve named legacy task envelopes and logs without rewriting or inventing historical manifests. Historical issue agent assignments remain valid through explicit compatibility mappings, never silent role reassignment. New dispatch paths, including the CLI, use the same admission boundary; unsupported legacy retries require a new explicit governed dispatch rather than fabricated context approval.
  - id: req-acceptance
    description: Automate deterministic context/policy/privacy/overflow/staleness tests, fake-protocol dispatch/execution tests and real isolated API/browser preview-dispatch-inspection-reload/restart flows. Prove denied requests cause no task/worktree/provider effect and project inspection leaves source bytes unchanged.
constraints:
  - Follow docs/architecture/phase-n-context-design.md and the path-specific draft tasks, subject to actual human approval before implementation.
  - The roadmap request authorizes design preparation, not automatic approval of this exact prospective contract.
  - The existing sole runtime, policy service, issue scope gates, managed worktrees, leases and review publication gates retain authority. Lower context layers cannot change their code-owned decisions.
  - Tracked role/context configuration contains no private data or machine paths. Project Markdown cannot create tool permissions, command authority or confidential-context consent.
  - Version new subdocuments without silently migrating or deleting historical normal state. Missing optional data and invalid required data remain distinct.
  - Do not change pinned H1-H4 canonical files or fingerprints merely to accommodate this feature. Product documentation additions must preserve declared Harness context budgets.
  - No paid calls, external messages, sibling mutations, new dependencies, commits, pushes, merges or deploys are included.
  - Application-selected project context sources are contained and bounded. Subsequent runtime filesystem reads are not guaranteed project-only; retain the existing sandbox, network, write-scope and approval controls and disclose this limitation in preview and runtime safety context.
nonGoals:
  - Executing delegated workflows, creating parallel workers or implementing the next roadmap phase.
  - Hierarchical company budgets, cost accounting, new scheduler infrastructure or autonomous routines.
  - Scaffold provisioning, source repinning, reconciliation or policy-waiver administration.
  - A new provider, fixed model, generic plugin framework or automatic semantic interpretation of arbitrary Markdown routing.
  - Universal prevention of sensitive user-authored text or model misinterpretation; sandbox and policy enforcement remain mandatory.
designContract:
  status: approved
  reviewedBy: repository-owner
  approvedAt: "2026-09-30T12:48:07Z"
  acceptanceChecks:
    - id: ac-behavior
      requirementIds: [req-roles, req-context, req-budget, req-privacy, req-routing, req-testing, req-preview, req-evidence, req-compatibility, req-acceptance]
      description: Offline fixtures and protocol fakes cover assembly, restrictions, privacy, staleness, persistence and dispatch behavior. The separate isolated real API/browser smoke is additionally mandatory before delivery.
      command: pnpm test
      expectedExitCode: 0
    - id: ac-schemas
      requirementIds: [req-roles, req-context, req-testing, req-evidence, req-compatibility]
      description: Compile product schemas and validate versioned role/config/context contracts plus explicit legacy compatibility through behavior tests.
      command: pnpm schemas:check
      expectedExitCode: 0
    - id: ac-types
      requirementIds: [req-roles, req-context, req-routing, req-preview, req-evidence]
      description: Typecheck policy, assembly, persistence, execution and UI integration without widening capabilities.
      command: pnpm typecheck
      expectedExitCode: 0
    - id: ac-build
      requirementIds: [req-preview, req-acceptance]
      description: Build the dashboard with role/context preview and inspectable task evidence.
      command: pnpm build
      expectedExitCode: 0
  checksWaiver: null
