name: Upstream Watcher

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstreams
        run: bash scripts/upstream/check-updates.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reports
          path: reports/
          if-no-files-found: ignore

